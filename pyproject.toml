[project]
name = "sbomminbench"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.33",
  "packageurl-python>=0.16",
  "packaging==26.3",
  "license-expression>=30.3",
  "licenseid==0.8.4",
  "pitloom[ai,content-type]==0.24.0",
]

[project.scripts]
sbomminbench = "sbomminbench.__main__:console_main"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --disable-socket"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["packageurl.*", "license_expression.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
